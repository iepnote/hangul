<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>한글 놀이터 — 우리 반 한글 학습 홈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --page-bg: #E9ECEF; --ink: #2D3436; --ink-soft: #777;
    --accent: #64B5F6; --accent-strong: #1E88E5; --accent-soft: #E3F2FD;
    --choice-bg: #F2FAFF; --choice-border: #90CAF9; --line-c: #dce2e8;
  }
  html, body { height: 100%; }
  body {
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    background: var(--page-bg); color: var(--ink); overflow: hidden;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    display: flex; flex-direction: column; word-break: keep-all;
  }
  #navbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px clamp(10px, 1.5vw, 20px);
    background: #fff; border-bottom: 1px solid var(--line-c); flex-shrink: 0;
  }
  #navbar .brand { font-size: clamp(18px, 2.6vw, 26px); font-weight: 800; color: var(--accent-strong); margin-right: auto; }
  #navbar .brand img { height: 2.2em; vertical-align: -0.75em; }
  .appico { height: 1.25em; vertical-align: -0.25em; }
  #mgTable th img.appico { height: 28px; display: block; margin: 0 auto 2px; }
  .app-row .emoji img { height: clamp(30px, 5vh, 44px); display: block; }
  .nav-btn {
    background: var(--accent-soft); border: none; border-radius: 999px;
    padding: 9px 16px; cursor: pointer; font-size: clamp(14px, 1.8vw, 18px); font-weight: bold; color: var(--accent-strong);
  }
  #screens { flex: 1; min-height: 0; padding: clamp(8px, 1.5vw, 16px); overflow-y: auto; }
  .screen { display: none; height: 100%; flex-direction: column; max-width: 1200px; margin: 0 auto; }
  .screen.active { display: flex; }
  .title { font-size: clamp(20px, 3vw, 30px); font-weight: 800; color: var(--accent-strong); text-align: center; padding: 14px 0 4px; }

  /* 학생 선택 */
  #stuGrid {
    flex: 1; display: flex; flex-wrap: wrap; gap: clamp(14px, 2.5vw, 30px);
    align-content: center; justify-content: center; padding: 10px 20px;
  }
  .stu-card {
    background: #fff; border: 5px solid var(--choice-border); border-radius: 28px;
    box-shadow: 0 6px 16px rgba(60,80,110,.15); cursor: pointer; text-align: center;
    width: clamp(150px, 22vw, 230px); padding: clamp(14px, 3vh, 28px) 8px; transition: .15s;
  }
  .stu-card:active { transform: translateY(3px); }
  .stu-card .face { font-size: clamp(52px, 9vh, 90px); line-height: 1.2; }
  .stu-card .face img, #dashName img {
    width: clamp(64px, 11vh, 110px); height: clamp(64px, 11vh, 110px);
    border-radius: 50%; object-fit: cover; border: 3px solid var(--choice-border); vertical-align: middle;
  }
  #dashName img { width: 48px; height: 48px; }
  .stu-card .name { font-size: clamp(22px, 3vw, 34px); font-weight: bold; color: var(--accent-strong); margin-top: 4px; }
  .stu-card.add { border-style: dashed; border-color: #b0bec5; box-shadow: none; background: #fafafa; }
  .stu-card.add .face, .stu-card.add .name { color: #90a4ae; }

  /* 진도판 */
  #dashName { text-align: center; font-size: clamp(22px, 3.4vw, 34px); font-weight: 800; padding: 6px 0; }
  #nextBox {
    background: #fff; border: 4px solid var(--accent-strong); border-radius: 24px;
    box-shadow: 0 6px 18px rgba(30,136,229,.2);
    margin: 8px auto; padding: 16px 22px; width: min(680px, 96%); text-align: center;
  }
  #nextBox .lab { font-size: clamp(14px, 1.8vw, 18px); color: var(--ink-soft); font-weight: bold; }
  #nextBox .what { font-size: clamp(22px, 3.2vw, 32px); font-weight: 800; margin: 6px 0 12px; }
  #nextBox .what .em { color: var(--accent-strong); }
  #btnGo {
    font-size: clamp(20px, 3vw, 28px); font-weight: 800; color: #fff;
    background: var(--accent-strong); border: none; border-radius: 20px;
    padding: 12px 44px; cursor: pointer; box-shadow: 0 5px 14px rgba(30,136,229,.35); transition: .15s;
  }
  #btnGo:active { transform: translateY(3px); }
  #appList { display: flex; flex-direction: column; gap: 10px; padding: 8px 0 20px; width: min(680px, 96%); margin: 0 auto; }
  .app-row {
    display: flex; align-items: center; gap: 14px;
    background: #fff; border: 3px solid var(--choice-border); border-radius: 18px;
    padding: 12px 16px; cursor: pointer; transition: .15s;
  }
  .app-row:active { transform: translateY(2px); }
  .app-row.done-all { border-color: #FFB300; background: #FFF8E1; }
  .app-row .emoji { font-size: clamp(26px, 4vh, 38px); }
  .app-row .info { flex: 1; }
  .app-row .nm { font-size: clamp(17px, 2.2vw, 22px); font-weight: 800; }
  .app-row .sub { font-size: clamp(12px, 1.5vw, 15px); color: var(--ink-soft); font-weight: bold; margin-top: 2px; }
  .bar { height: 12px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: var(--accent-strong); border-radius: 999px; transition: width .4s; }
  .app-row .pct { font-size: clamp(15px, 2vw, 19px); font-weight: 800; color: var(--accent-strong); min-width: 74px; text-align: right; }
  /* 선생님 모드: 앱별 전 단원 칩 */
  .nav-btn.on { background: var(--accent-strong); color: #fff; }
  .unit-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 4px 12px 56px; }
  .unit-chip {
    font-size: clamp(14px, 1.8vw, 18px); font-weight: bold;
    border: 2px solid var(--choice-border); background: #fff; color: var(--ink);
    border-radius: 12px; padding: 6px 12px; cursor: pointer;
  }
  .unit-chip.done { border-color: #FFB300; background: #FFF8E1; }
  .unit-chip:active { transform: translateY(2px); }
  .home-footer { text-align: center; font-size: 11px; color: #9e9e9e; padding: 6px 12px 10px; flex-shrink: 0; }
  .home-footer a { color: inherit; }

  /* 학생 관리 */
  #mgWrap { overflow: auto; background: #fff; border: 3px solid var(--choice-border); border-radius: 18px; margin: 8px auto 16px; width: min(880px, 98%); }
  #mgTable { width: 100%; border-collapse: collapse; font-size: clamp(14px, 1.8vw, 17px); }
  #mgTable th, #mgTable td { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--line-c); }
  #mgTable th { background: var(--accent-soft); color: var(--accent-strong); font-size: clamp(13px, 1.7vw, 16px); }
  #mgTable .stu { font-weight: 800; display: flex; align-items: center; gap: 8px; justify-content: flex-start; padding-left: 6px; }
  #mgTable .stu img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--choice-border); }
  #mgTable .stu .emo { font-size: 28px; }
  #mgTable .pct { font-weight: 800; color: var(--accent-strong); }
  #mgTable .pct small { display: block; font-weight: normal; color: var(--ink-soft); }
  #mgTable .mini-bar { height: 7px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; margin-top: 4px; }
  #mgTable .mini-bar > div { height: 100%; background: var(--accent-strong); }
  #mgTable button { border: none; background: #f0f2f5; border-radius: 10px; padding: 7px 9px; margin: 0 2px; cursor: pointer; font-size: 16px; }
  #mgTable button.del { background: #ffebee; }

  /* 🏫 교실(동기화) 모달 */
  #classModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 55; align-items: center; justify-content: center; }
  #classModal.open { display: flex; }
  #clsBox { background: #fff; border-radius: 22px; padding: 20px 24px; width: min(460px, 92vw); max-height: 88vh; overflow-y: auto; }
  #clsBox h3 { font-size: 20px; color: var(--accent-strong); text-align: center; }
  #clsBox .sec { border: 2px solid var(--line-c); border-radius: 14px; padding: 12px 14px; margin-top: 12px; }
  #clsBox .sec .st { font-weight: 800; margin-bottom: 8px; }
  #clsBox input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 9px 10px; margin-top: 6px; border: 2px solid var(--choice-border); border-radius: 10px; }
  #clsBox .go { width: 100%; margin-top: 10px; background: var(--accent-strong); color: #fff; border: none; border-radius: 12px; padding: 11px; font-size: 16px; font-weight: 800; cursor: pointer; }
  #clsBox .go.gray { background: #b0bec5; }
  #clsBox .code-big { font-size: 34px; font-weight: 800; letter-spacing: 6px; text-align: center; color: var(--accent-strong); padding: 6px 0; }
  #clsBox .hint { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; line-height: 1.5; }
  #clsMsg { text-align: center; font-size: 14px; font-weight: bold; min-height: 1.4em; margin-top: 10px; color: #e53935; }
  #clsMsg.ok { color: #2E7D32; }
  #clsClose { display: block; margin: 12px auto 0; background: #f0f2f5; border: none; border-radius: 12px; padding: 9px 22px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .nav-btn.linked { background: #E8F5E9; color: #2E7D32; }

  /* 사진 모달 */
  #photoModal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50;
    align-items: center; justify-content: center;
  }
  #photoModal.open { display: flex; }
  #pmBox { background: #fff; border-radius: 22px; padding: 20px 24px; width: min(440px, 92vw); text-align: center; }
  #pmTitle { font-weight: 800; font-size: 20px; color: var(--accent-strong); }
  #pmPreview {
    margin: 14px auto 6px; width: 130px; height: 130px; border-radius: 50%;
    border: 3px solid var(--choice-border); overflow: hidden;
    background: repeating-conic-gradient(#eee 0% 25%, #fff 0% 50%) 0 0/20px 20px; /* 투명 확인용 체크무늬 */
    display: flex; align-items: center; justify-content: center; font-size: 48px; color: #b0bec5;
  }
  #pmPreview img { width: 100%; height: 100%; object-fit: cover; }
  #pmBox .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  #pmBox .row button, #pmBox .row label.chk {
    border: 2px solid var(--choice-border); background: #fff; border-radius: 12px;
    padding: 9px 14px; cursor: pointer; font-size: 15px; font-weight: bold; color: var(--ink);
  }
  #pmBox .row label.chk { display: flex; align-items: center; gap: 6px; }
  #pmHint { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
  #pmBox .act { margin-top: 14px; display: flex; gap: 10px; justify-content: center; }
  #pmOk { background: var(--accent-strong); color: #fff; border: none; border-radius: 14px; padding: 10px 30px; font-size: 17px; font-weight: 800; cursor: pointer; }
  #pmOk:disabled { background: #b0bec5; cursor: default; }
  #pmCancel, #pmClear { background: #f0f2f5; border: none; border-radius: 14px; padding: 10px 18px; font-size: 15px; font-weight: bold; cursor: pointer; }
  #pmClear { background: #ffebee; }

  /* 📱 좁은 화면(핸드폰): 세로 스크롤 허용 */
  @media (max-width: 640px), (max-height: 520px) {
    html, body { height: auto; min-height: 100%; }
    body { overflow-y: auto; }
    #navbar { flex-wrap: wrap; }
    #screens { overflow: visible; }
    .screen { height: auto; }
    .screen.active { display: flex; }
    #stuGrid { overflow: visible; }
  }
</style>
</head>
<body>

<nav id="navbar">
  <div class="brand"><img id="brandIco" alt=""> 한글 놀이터</div>
  <!-- 학생 화면에는 🧑‍🏫 선생님 버튼만 — 교실·학생 관리·어휘 편집은 PIN 뒤 교사 화면에 -->
  <button class="nav-btn" id="btnTeacher">🏫 선생님</button>
  <button class="nav-btn" id="btnClass" style="display:none">🔗 교실</button>
  <button class="nav-btn" id="btnManage" style="display:none">👥 학생 관리</button>
  <button class="nav-btn" id="btnBackStu" style="display:none">👤 학생 바꾸기</button>
</nav>

<div id="screens">
  <!-- 학생 선택 -->
  <div class="screen active" id="scr-stu">

  <!-- 진도판 -->
  <div class="screen" id="scr-dash">
    <div id="dashHead" style="display:flex; align-items:center; justify-content:center; gap:14px">
      <div id="dashName"></div>
      <button class="nav-btn" id="btnFree">🎈 자유 모드</button>
    </div>
    <div id="nextBox">
      <div class="lab">✨ 다음에 할 공부</div>
      <div class="what" id="nextWhat"></div>
      <button id="btnGo">▶ 이어서 하기</button>
    </div>
    <div id="appList"></div>
  </div>

  <!-- 학생 관리: 학생 편집 + 진도 한눈에 -->
  <div class="screen" id="scr-manage">
    <div class="title">🧑‍🏫 학생 관리</div>
    <div id="mgWrap"><table id="mgTable"></table></div>
  </div>
</div>

<!-- 🏫 교실 모달: 교실 코드로 여러 기기에서 학생·진도·어휘 동기화 (매일수학과 같은 교실 코드) -->
<div id="classModal"><div id="clsBox">
  <h3>🏫 교실 연결</h3>
  <div id="clsBody"></div>
  <div id="clsMsg"></div>
  <button id="clsClose">닫기</button>
</div></div>

<!-- 학생 사진 모달: 파일 올리기 · 붙여넣기(Ctrl+V) · 배경 투명 옵션 -->
<div id="photoModal">
  <div id="pmBox">
    <div id="pmTitle">📷 학생 사진</div>
    <div id="pmPreview">🙂</div>
    <div class="row">
      <button id="pmFile">📁 파일 올리기</button>
      <button id="pmPaste">📋 붙여넣기</button>
      <label class="chk"><input type="checkbox" id="pmTransparent"> 배경 투명</label>
    </div>
    <div id="pmHint">복사한 사진이 있으면 Ctrl+V 를 눌러도 돼요</div>
    <div class="act">
      <button id="pmOk" disabled>확인</button>
      <button id="pmClear" style="display:none">🗑 사진 지우기</button>
      <button id="pmCancel">취소</button>
    </div>
  </div>
</div>

const REMOTE = {
  url: 'https://flabuodwvywblybbfqwc.supabase.co',
  anonKey: 'sb_publishable_tNAVsdnTtUePE1zaKCeX-A_vWkWM8OM',   // 공개용(publishable) 키 — 내장 설계

function hubClass() { return loadStore("hubClass"); }
async function sha256(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function sb(path, opt, code) {
  const h = { "apikey": REMOTE.anonKey, "Content-Type": "application/json",
              "x-class-code": code || (hubClass() || {}).code || "" };
  if (/^eyJ/.test(REMOTE.anonKey)) h["Authorization"] = "Bearer " + REMOTE.anonKey;
  Object.assign(h, (opt || {}).headers || {});
  const r = await fetch(REMOTE.url + "/rest/v1/" + path, Object.assign({}, opt, { headers: h }));
  if (!r.ok) throw new Error("sb " + r.status + " " + (await r.text()).slice(0, 120));
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

async function createClass(school, name, pin) {
  const pinHash = await sha256(pin);
  for (let i = 0; i < 3; i++) {
    const code = String(Math.floor(100000 + Math.random() * 900000));
    try {
      await sb("classes", { method: "POST", body: JSON.stringify({ code, school, name, teacher: "", pin_hash: pinHash }) }, code);
      return code;
    } catch (e) { if (i === 2) throw e; }   // 코드 충돌 시 재시도
  }
}
async function connectClass(code, pin) {
  const rows = await sb("classes?code=eq." + code + "&select=code,school,name,pin_hash", null, code);
  if (!rows || !rows.length) throw new Error("교실을 찾을 수 없어요. 코드를 확인해 주세요.");
  if (rows[0].pin_hash !== await sha256(pin)) throw new Error("PIN이 맞지 않아요.");
  saveStore("hubClass", { code, school: rows[0].school, name: rows[0].name, pinHash: rows[0].pin_hash, last: 0 });   // pinHash=교사 화면 잠금용
}

function readApp(key) { return loadStore(key) || { version: 1, lastStudent: null, students: {} }; }
function mergeProg(loc, rem) {
  const out = Object.assign({}, rem, loc);
  for (const k in rem) {
    const l = loc[k] || {}, r = rem[k];
    out[k] = { stars: Math.max(l.stars || 0, r.stars || 0),
               tries: Math.max(l.tries || 0, r.tries || 0),
               correct: Math.max(l.correct || 0, r.correct || 0) };
  }
  return out;
}
function isEmptyCustom(c) {

}

          if ((ra.stickers || []).length > (st.stickers || []).length) st.stickers = ra.stickers;
          if (!st.settings) st.settings = ra.settings || JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
          st.dates = [...new Set([...(st.dates || []), ...(ra.dates || [])])].sort();   // 📅 달력 도장 합집합
        }
        saveStore(app.key, d);
      });
      if (row.photo) { const ph = photos(); if (!ph[row.name]) { ph[row.name] = row.photo; saveStore("hubPhotos", ph); } }
    });
    // 3) 교사 편집 합치기(로컬이 비어 있으면 원격 채택)
    remCus.forEach(row => {
      const d = loadStore(row.app_key);
      if (d && isEmptyCustom(d.custom) && !isEmptyCustom(row.data)) { d.custom = row.data; saveStore(row.app_key, d); }
    });
    // 4) 밀어 올리기 — 학생(이름 기준 upsert) + 교사 편집
    const rows = allStudents().map(s => {
      const apps = {};
      APPS.forEach(app => {
        const d = readApp(app.key);
        const st = Object.values(d.students).find(x => x.name === s.name);
        if (st) apps[app.key] = { progress: st.progress || {}, settings: st.settings || {}, stickers: st.stickers || [], dates: st.dates || [] };
      });
      return { id: "s" + cls.code + "_" + btoa(unescape(encodeURIComponent(s.name))).replace(/=/g, ""),
               class_code: cls.code, name: s.name, avatar: s.avatar,
               photo: photos()[s.name] || null, apps, updated_at: new Date().toISOString() };
    });
    if (rows.length)
      await sb("hangul_students?on_conflict=class_code,name", {
        method: "POST", headers: { "Prefer": "resolution=merge-duplicates" }, body: JSON.stringify(rows) });
    const cus = APPS.map(app => ({ class_code: cls.code, app_key: app.key,
                                   data: (loadStore(app.key) || {}).custom || {}, updated_at: new Date().toISOString() }))
                    .filter(x => !isEmptyCustom(x.data));
    if (cus.length)
      await sb("hangul_custom", {
        method: "POST", headers: { "Prefer": "resolution=merge-duplicates" }, body: JSON.stringify(cus) });
    cls.last = Date.now();
    saveStore("hubClass", cls);
    renderClassBtn();
    if (document.getElementById("scr-stu").classList.contains("active")) renderStudents();
    if (document.getElementById("scr-manage").classList.contains("active")) renderManage();
    if (!silent) clsMsg("동기화 완료! (" + rows.length + "명)", true);
  } catch (e) {
    if (!silent) clsMsg("동기화 실패: 인터넷 연결이나 준비 상태를 확인해 주세요.");
    console.warn("sync", e);
  } finally { syncBusy = false; }
}

let pmName = null, pmSrcImg = null, pmResult = null;

function pmLoad(srcUrl) {
  const img = new Image();
  img.onload = () => { pmSrcImg = img; pmProcess(); };
  img.src = srcUrl;
}
/* 200px 중앙 정사각형 크롭 (+옵션: 테두리 색 기준 flood fill로 배경 투명화) */
function pmProcess() {
  if (!pmSrcImg) return;
  const size = 200;
  const cv = document.createElement("canvas");
  cv.width = cv.height = size;
  const cx = cv.getContext("2d");
  const m = Math.min(pmSrcImg.width, pmSrcImg.height);
  cx.drawImage(pmSrcImg, (pmSrcImg.width - m) / 2, (pmSrcImg.height - m) / 2, m, m, 0, 0, size, size);
  if (document.getElementById("pmTransparent").checked) {
    const im = cx.getImageData(0, 0, size, size), d = im.data;
    const corners = [0, (size - 1) * 4, (size - 1) * size * 4, ((size * size) - 1) * 4];
    let r = 0, g = 0, b = 0;
    corners.forEach(i => { r += d[i]; g += d[i + 1]; b += d[i + 2]; });
    r /= 4; g /= 4; b /= 4;
    const near = i => Math.abs(d[i] - r) + Math.abs(d[i + 1] - g) + Math.abs(d[i + 2] - b) < 120;
    const seen = new Uint8Array(size * size);
    const q = [];
    for (let x = 0; x < size; x++) { q.push(x, x + (size - 1) * size); }
    for (let y = 0; y < size; y++) { q.push(y * size, y * size + size - 1); }
    while (q.length) {
      const p = q.pop();
      if (seen[p]) continue;
      seen[p] = 1;
      if (!near(p * 4)) continue;
      d[p * 4 + 3] = 0;
      const x = p % size, y = (p - x) / size;
      if (x > 0) q.push(p - 1);
      if (x < size - 1) q.push(p + 1);
      if (y > 0) q.push(p - size);
      if (y < size - 1) q.push(p + size);
    }
    cx.putImageData(im, 0, 0);
    pmResult = cv.toDataURL("image/png");
  } else {
    pmResult = cv.toDataURL("image/jpeg", 0.82);
  }
  document.getElementById("pmPreview").innerHTML = '<img src="' + pmResult + '" alt="">';
  document.getElementById("pmOk").disabled = false;
}

function ensureStudent(name, app) {
  const d = loadStore(app.key) || { version: 1, lastStudent: null, students: {} };
  if (!d.students) d.students = {};
  if (!Object.values(d.students).some(s => s.name === name)) {
    const src = allStudents().find(s => s.name === name);
    const id = "s" + Date.now();
    d.students[id] = { name, avatar: (src && src.avatar) || "🐰",
                       settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), progress: {}, stickers: [] };
    saveStore(app.key, d);
  }
}
function gotoApp(app, unit) {
  if (curName) ensureStudent(curName, app);
  location.href = app.href + (curName ? "?s=" + encodeURIComponent(curName) : "?guest=1") +
    (unit ? "&u=" + encodeURIComponent(unit) : "");
}
function loadStore(key) {
  try { return JSON.parse(localStorage.getItem(key)) || null; } catch (e) { return null; }
}
function saveStore(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); }
  catch (e) {
    console.warn("저장 실패", key, e);
    if (!saveStore._warned) {   // 세션당 1회만 — 어떤 항목이 실패했는지 알려줌
      saveStore._warned = true;
      alert("저장 공간이 부족해 '" + key + "' 저장에 실패했어요.\n교사 편집의 큰 그림이나 학생 사진을 줄이면 해결돼요.");
    }
  }
}
/* 4개 앱의 학생을 이름으로 합친다 */
function allStudents() {
  const map = {};   // name -> {name, avatar}
  APPS.forEach(a => {
    const d = loadStore(a.key);
    if (d && d.students) Object.values(d.students).forEach(s => {
      if (!map[s.name]) map[s.name] = { name: s.name, avatar: s.avatar };
    });
  });
  return Object.values(map);
}
/* 학생 추가: 4개 앱 저장소에 동시에 만든다 */
function addStudentEverywhere(name) {
  const used = allStudents().map(s => s.avatar);
  const avatar = AVATARS.find(a => !used.includes(a)) || AVATARS[allStudents().length % AVATARS.length];
  APPS.forEach((a, i) => {
    const d = loadStore(a.key) || { version: 1, lastStudent: null, students: {} };
    if (!d.students) d.students = {};
    const exists = Object.values(d.students).some(s => s.name === name);
    if (!exists) {
      const id = "s" + Date.now() + "_" + i;
      d.students[id] = { name, avatar, settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), progress: {}, stickers: [] };
      saveStore(a.key, d);
    }
  });
}
/* 학생의 앱별 진도: {done, total, next} — 항목 완료 = 별 3 */
function progressOf(name, app) {
  const d = loadStore(app.key);
  let prog = {};
  if (d && d.students) {
    const s = Object.values(d.students).find(x => x.name === name);
    if (s) prog = s.progress || {};
  }
  let done = 0;
  let next = null;
  app.order.forEach(item => {
    if (((prog[item] || {}).stars || 0) >= 3) done++;
    else if (next === null) next = item;
  });
  return { done: Math.min(done, app.order.length), total: app.order.length, next };
}
/* 추천: 위계 순서에서 첫 미완료 앱의 첫 미완료 항목 */
function recommend(name) {
  for (const app of APPS) {
    const p = progressOf(name, app);
    if (p.done < p.total) return { app, next: p.next, p };
  }
  return null;   // 전부 완료!
}

function renameEverywhere(oldN, newN) {

      Object.values(d.students).forEach(s => { if (s.name === oldN) s.name = newN; });

      saveStore(a.key, d);

function lastStudy(name) {
  let last = "";
  APPS.forEach(a => {
    const d = loadStore(a.key);

    ((s && s.dates) || []).forEach(x => { if (x > last) last = x; });

    });
    const bDel = document.createElement("button");
    bDel.textContent = "🗑️"; bDel.className = "del"; bDel.title = "삭제";
    bDel.addEventListener("click", () => {
      if (!confirm("'" + s.name + "' 학생을 4개 앱에서 모두 삭제할까요?\n(진도·별·스티커가 지워져요)")) return;
      deleteEverywhere(s.name);
      renderManage(); renderStudents();
    });
    td.append(bPhoto, bName, bDel);
    tb.appendChild(tr);
  });
  const trAdd = document.createElement("tr");
  trAdd.innerHTML = '<td colspan="' + (APPS.length + 3) + '"><button id="mgAdd" style="background:var(--accent-soft);color:var(--accent-strong);font-weight:800;padding:9px 22px">➕ 학생 추가</button></td>';
  trAdd.querySelector("#mgAdd").addEventListener("click", addStudentFlow);
  tb.appendChild(trAdd);
  // ✏️ 어휘 편집(교사용): 앱 안 편집 화면으로 바로 이동 — 학생 화면에는 편집 버튼이 없다
  const trEdit = document.createElement("tr");
  trEdit.innerHTML = '<td colspan="' + (APPS.length + 3) + '" style="text-align:left;padding:12px 14px"><b style="margin-right:8px">✏️ 어휘 편집</b>' +
    APPS.map((a, i) => '<button data-i="' + i + '" style="margin:2px 4px;padding:8px 12px">' + icoHTML(a) + " " + a.nm + '</button>').join("") + '</td>';
  trEdit.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => location.href = APPS[b.dataset.i].href + "?edit=1"));
  tb.appendChild(trEdit);
  // 🔗 아이용 링크(가정 복습): 교실 초대 링크 복사 — 매일수학과 같은 문법
  const trInv = document.createElement("tr");
  trInv.innerHTML = '<td colspan="' + (APPS.length + 3) + '" style="text-align:left;padding:12px 14px">' +
    '<b style="margin-right:8px">🔗 아이용 링크</b>' +
    '<button id="mgInvite" style="padding:8px 14px;background:var(--accent-soft);color:var(--accent-strong);font-weight:800">복사해서 학부모에게 보내기</button>' +
    '<small style="color:#78909c;margin-left:8px">아이는 링크로 들어와 자기 이름만 눌러요 · 기록은 교실로 자동 동기화</small></td>';
  trInv.querySelector("#mgInvite").addEventListener("click", () => copyInvite());
  tb.appendChild(trInv);
}
document.getElementById("btnManage").addEventListener("click", () => { renderManage(); show("scr-manage"); syncNow(true); });   // 진입 시 원격 진도 당겨 오기(끝나면 자동 재렌더)
document.getElementById("btnTeacher").addEventListener("click", async () => {
  if (!await teacherGate()) return;
  renderManage(); show("scr-manage");
  syncNow(true);   // 진입 시 원격 진도 당겨 오기(끝나면 자동 재렌더)
});
function renderStudents() {
  const grid = document.getElementById("stuGrid");
  grid.innerHTML = "";
  allStudents().forEach(s => {
    const c = document.createElement("div");
    c.className = "stu-card";
    c.innerHTML = '<div class="face">' + faceHTML(s) + '</div><div class="name">' + s.name + "</div>";
    c.addEventListener("click", () => { curName = s.name; freeMode = false; renderDash(); show("scr-dash"); });
    grid.appendChild(c);
  });
  const add = document.createElement("div");
  add.className = "stu-card add";
  add.innerHTML = '<div class="face">➕</div><div class="name">학생 추가</div>';
  add.addEventListener("click", addStudentFlow);
  grid.appendChild(add);
  // 🎈 손님 자유 모드: 학생 정보 없이 아무 단계나 놀기(기록 저장 안 됨)
  const guest = document.createElement("div");
  guest.className = "stu-card add";
  guest.style.borderColor = "var(--accent)";
  guest.innerHTML = '<div class="face">🎈</div><div class="name" style="color:var(--accent-strong)">자유 모드</div>';
  guest.addEventListener("click", () => { curName = null; freeMode = true; renderDash(); show("scr-dash"); });
  grid.appendChild(guest);
}
function renderDash() {
  const guest = !curName;
  const s = allStudents().find(x => x.name === curName);
  document.getElementById("dashName").innerHTML = guest
    ? "🎈 자유 모드 <span style='font-size:.55em;color:var(--ink-soft)'>(기록 저장 없이 놀기)</span>"
    : (s ? faceHTML(s) + " " : "") + curName;
  document.getElementById("btnFree").style.display = guest ? "none" : "";
  document.getElementById("nextBox").style.display = guest ? "none" : "";
  if (!guest) {
  const rec = recommend(curName);
  const what = document.getElementById("nextWhat");
  const go = document.getElementById("btnGo");
  if (rec) {
    what.innerHTML = icoHTML(rec.app) + ' <span class="em">' + rec.app.nm + "</span> — " +
      (rec.next ? "'" + rec.next + "' " + rec.app.unitLabel + " 차례예요!" : "이어서 해요!");
    go.onclick = () => gotoApp(rec.app, rec.next);
  } else {
    what.innerHTML = "🎉 네 가지 놀이를 모두 마쳤어요! 최고!";
    go.onclick = () => gotoApp(APPS[0], null);
  }
  }
  const list = document.getElementById("appList");
  list.innerHTML = "";
  APPS.forEach(app => {
    const p = progressOf(curName, app);
    const pct = Math.round(p.done / p.total * 100);
    const row = document.createElement("div");
    row.className = "app-row" + (p.done >= p.total ? " done-all" : "");
    row.innerHTML = '<div class="emoji">' + icoHTML(app) + '</div>' +
      '<div class="info"><div class="nm">' + app.nm + (p.done >= p.total ? " 🎓" : "") + '</div>' +
      '<div class="sub">' + p.done + " / " + p.total + " " + app.unitLabel + " 완료" +
      (p.next ? " · 다음: " + p.next : "") + '</div>' +
      '<div class="bar"><div style="width:' + pct + '%"></div></div></div>' +
      '<div class="pct">' + pct + "%</div>";
    row.addEventListener("click", () => gotoApp(app, null));
    list.appendChild(row);
    if (freeMode) {
      // 🎈 자유 모드: 전 단원 칩 — 아무 단계나 골라 바로 시작 (완료=금색)
      const d = loadStore(app.key);
      let prog = {};
      if (d && d.students) {
        const st = Object.values(d.students).find(x => x.name === curName);
        if (st) prog = st.progress || {};
      }
      const chips = document.createElement("div");
      chips.className = "unit-chips";
      (app.chips || app.order).forEach(item => {   // 단어카드는 낱말 106개 대신 분류(가~하) 칩
        const done = app.chips
          ? app.order.filter(w => w[0] === item).every(w => ((prog[w] || {}).stars || 0) >= 3)
          : ((prog[item] || {}).stars || 0) >= 3;
        const chip = document.createElement("button");
        chip.className = "unit-chip" + (done ? " done" : "");
        chip.textContent = item;
        chip.addEventListener("click", e => {
          e.stopPropagation();
          gotoApp(app, item);
        });
        chips.appendChild(chip);
      });
      list.appendChild(chips);
    }
  });
}
document.getElementById("btnFree").addEventListener("click", () => {
  freeMode = !freeMode;
  document.getElementById("btnFree").classList.toggle("on", freeMode);
  renderDash();
});
document.getElementById("btnBackStu").addEventListener("click", () => { show("scr-stu"); renderStudents(); });
/* 앱에서 돌아왔을 때 최신 진도 반영 + 교실 자동 동기화(10초 간격 제한) */
let lastAutoSync = 0;
function autoSync() {
  if (hubClass() && Date.now() - lastAutoSync > 10000) { lastAutoSync = Date.now(); syncNow(true); }
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    autoSync();
    if (curName && document.getElementById("scr-dash").classList.contains("active")) renderDash();
  }
});
window.addEventListener("pageshow", () => {
  autoSync();
  if (curName && document.getElementById("scr-dash").classList.contains("active")) renderDash();
});
/* ── 🔗 아이용 링크(매일수학 초대 링크 문법): ?code=ABC123 로 열면 교실 자동 연결 ──
   PIN 없이 연결하되 pin_hash는 저장 → 학부모 기기에서도 🧑‍🏫 교사 화면은 PIN으로 잠김 */
function inviteUrl() {
  const base = /^https?:/.test(location.protocol) && !/localhost|127\./.test(location.hostname)
    ? location.origin + location.pathname.replace(/[^/]*$/, "")
    : "https://iepnote.github.io/hangul/play/";   // file://·로컬 실행이면 공식 주소로 생성
  return base + "?code=" + hubClass().code;
}
async function copyInvite() {
  const cls = hubClass();
  if (!cls) { alert("먼저 교사 화면의 🏫 교실에서 교실을 만들거나 연결해 주세요."); return; }
  const url = inviteUrl();
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {}
  window.prompt((ok ? "복사됐어요! " : "아래 링크를 길게 눌러 복사하세요. ") +
    "카톡 등으로 학부모에게 보내 주세요.\n아이는 링크로 들어와 자기 이름만 누르면 되고, 기록은 교실로 자동 동기화됩니다.", url);
}
(async function () {
  const q = new URLSearchParams(location.search);
  const code = (q.get("code") || "").toUpperCase();
  if (code) try { history.replaceState(null, "", location.pathname); } catch (e) {}   // 소비 후 URL 정리
  if (/^[A-Z0-9]{6}$/.test(code) && (!hubClass() || hubClass().code !== code)) {
    try {
      const rows = await sb("classes?code=eq." + code + "&select=code,school,name,pin_hash", null, code);
      if (rows && rows.length) {
        saveStore("hubClass", { code, school: rows[0].school, name: rows[0].name, pinHash: rows[0].pin_hash, last: 0 });
        renderClassBtn();
        syncNow(true);   // 학생 명단·진도 당겨 오기(끝나면 학생 화면 자동 재렌더)
      }
    } catch (e) { console.warn("invite", e); }
  }
})();
document.getElementById("brandIco").src = APP_ICONS.hub;
renderStudents();
renderClassBtn();
autoSync();   // 시작 시 1회(교실 연결 시)
</script>
